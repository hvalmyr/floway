---
# Идемпотентный бутстрап чистой Ubuntu 24.04 VPS: пользователь для деплоя,
# Docker, своп, автообновления безопасности, fail2ban, ufw, ssh-хардненинг.
#
# Первый запуск против чистой машины (пока нет пользователя deploy):
#   ansible-playbook playbooks/bootstrap.yml -e ansible_user=root --vault-password-file .vault_pass
#
# Повторные запуски (после того как deploy_user создан и захардненен SSH):
#   ansible-playbook playbooks/bootstrap.yml --vault-password-file .vault_pass
#
# decor-сайт — тот же физический хост (см. inventory/production.yml), уже
# забутстрапленный при первом прогоне против floway_prod; повторный
# bootstrap с -e target_group=floway_decor_prod идемпотентен, но обычно не
# нужен — только если решено вынести decor на отдельный VPS (см.
# docs/decor-site-audit.md §6).
#
# Роли идут в порядке, где самая рискованная (ssh_hardening) — последняя,
# и только после того, как deploy_user с рабочим ключом уже создан.
- name: Bootstrap production VPS
  hosts: "{{ target_group | default('floway_prod') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Ensure this is Ubuntu (this playbook targets Ubuntu 24.04)
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: "Этот плейбук рассчитан на Ubuntu (проверялся на 24.04)."

  roles:
    - bootstrap_user
    - docker
    - swap
    - unattended_upgrades
    - fail2ban
    - firewall
    - ssh_hardening
