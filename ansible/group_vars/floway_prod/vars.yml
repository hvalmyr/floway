---
# Несекретные переменные для группы floway_prod. Секреты — в
# group_vars/floway_prod/vault.yml (см. vault.yml.example рядом).

# --- Пользователь для деплоя/эксплуатации ---
deploy_user: deploy
# TODO: замени на свой публичный SSH-ключ (не секрет, можно коммитить как есть).
deploy_user_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... your-key-comment"

# --- SSH / фаервол ---
ssh_port: 22
enable_http_https_ports: true # открыть 80/443 для Caddy

# --- Своп (полезно даже без сборки на VPS — Postgres+несколько контейнеров на маленькой машине) ---
enable_swap: true
swap_size: "2G"
swap_file_path: /swapfile

# --- Домен и TLS (Caddy, автоматический Let's Encrypt) ---
# ВАЖНО: A/AAAA-запись домена должна указывать на IP этой VPS ДО запуска
# deploy.yml — иначе Caddy не сможет пройти ACME HTTP-01 challenge.
floway_domain: "floway.example.com" # TODO: замени на реальный домен
caddy_acme_email: "admin@example.com" # TODO: email для уведомлений Let's Encrypt

# --- Образы (GHCR, публикуются через GitHub Actions — см. ansible/README.md) ---
github_owner: "hvalmyr"
backend_image: "ghcr.io/{{ github_owner }}/floway-backend"
frontend_image: "ghcr.io/{{ github_owner }}/floway-frontend"
image_tag: "latest"

# Публичные GHCR-пакеты не требуют логина. Если сделаешь пакеты приватными —
# поставь true и заполни vault_ghcr_username/vault_ghcr_token в vault.yml.
ghcr_login_required: false

# --- Куда деплоим приложение на VPS ---
deploy_path: /opt/floway
