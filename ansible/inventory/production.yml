---
# Заполни перед первым запуском.
#
# ansible_user: deploy — потому что после bootstrap.yml вход только под этим
# пользователем (root-логин и пароль отключены). На САМЫЙ ПЕРВЫЙ прогон
# bootstrap.yml против чистой VPS (когда пользователя deploy ещё не существует)
# нужно переопределить пользователя:
#
#   ansible-playbook playbooks/bootstrap.yml -e ansible_user=root --vault-password-file .vault_pass
#
# (или -e ansible_user=root -e ansible_ssh_pass=... если провайдер выдал пароль,
# либо ansible_ssh_private_key_file, если провайдер сразу принял твой публичный
# ключ для root — это самый частый случай у большинства VPS-хостеров).
floway_prod:
  hosts:
    floway-vps:
      ansible_host: "79.143.29.84"
      ansible_user: deploy
      ansible_python_interpreter: /usr/bin/python3

# decor-сайт (flo-way.ru) — второй независимый стек на ТОМ ЖЕ физическом
# хосте (см. docs/decor-site-audit.md: ресурсов VPS хватает), другой
# deploy_path и набор секретов (group_vars/floway_decor_prod/). Собственный
# host-алиас (не floway-vps повторно) — с одним и тем же алиасом в обеих
# группах Ansible слил бы их в один host-объект и подмешивал group_vars
# floway_prod (включая её vault-секреты) в прогон против floway_decor_prod;
# отдельный алиас с тем же ansible_host держит группы полностью изолированными
# по переменным, при этом реально это один сервер. Если позже decor
# переедет на отдельный VPS, здесь меняется только ansible_host.
floway_decor_prod:
  hosts:
    floway-decor-vps:
      ansible_host: "79.143.29.84"
      ansible_user: deploy
      ansible_python_interpreter: /usr/bin/python3
