---
# Несекретные переменные для группы floway_prod. Секреты — в
# group_vars/floway_prod/vault.yml (см. vault.yml.example рядом).

# --- Пользователь для деплоя/эксплуатации ---
deploy_user: deploy
# По одному ключу на строку — authorized_key авторизует их все.
# TODO: третьей строкой сюда нужен публичный ключ для GitHub Actions (см.
# ansible/README.md → «Деплой из CI»), после чего один раз прогнать
# `just bootstrap`, чтобы он доехал до ~deploy/.ssh/authorized_keys на VPS.
# Отдельный ключ для CI, а не переиспользование личного: его можно отозвать
# (убрать строку + `just bootstrap`), не трогая свои рабочие машины.
deploy_user_ssh_public_key: |
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICZmi7F5zuJk/pZvi01lbRsyAmt7yKMfRed5LuMDMCcB jazz@cmc
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHYT81b4h6nuW+RhbzMewSUEgKW2KPjLXQrxxNzNuwww zornfeuer@vargasov-arch
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMb5GknF8OTNHV097WHaJQc0OBabBM3raBYeL/l6OOdk github-actions@floway

# --- SSH / фаервол ---
ssh_port: 22
enable_http_https_ports: true # открыть 80/443 для Caddy

# --- Своп (полезно даже без сборки на VPS — Postgres+несколько контейнеров на маленькой машине) ---
enable_swap: true
swap_size: "2G"
swap_file_path: /swapfile

# --- Домен и TLS (Caddy, автоматический Let's Encrypt) ---
# ВАЖНО: A/AAAA-запись домена должна указывать на IP этой VPS ДО запуска
# deploy.yml — иначе Caddy не сможет пройти ACME HTTP-01 challenge.
floway_domain: "kursfloristiki.ru"
caddy_acme_email: "floway-mos@mail.ru"

# --- Образы (GHCR, публикуются через GitHub Actions — см. ansible/README.md) ---
github_owner: "hvalmyr"
backend_image: "ghcr.io/{{ github_owner }}/floway-backend"
frontend_image: "ghcr.io/{{ github_owner }}/floway-frontend"
image_tag: "latest"

# Публичные GHCR-пакеты не требуют логина. Если сделаешь пакеты приватными —
# поставь true и заполни vault_ghcr_username/vault_ghcr_token в vault.yml.
ghcr_login_required: false

# --- Куда деплоим приложение на VPS ---
deploy_path: /opt/floway

# --- Прокси для Telegram Bot API (см. README.md → «Если прод-VPS в РФ») ---
# Пусто (по умолчанию) = бэкенд идёт к api.telegram.org напрямую. Заполни
# vault_telegram_tunnel_host/_user/_private_key в vault.yml, когда появится
# зарубежный VPS — сайдкар telegram-proxy (docker-compose.prod.yml) включится
# сам через COMPOSE_PROFILES при следующем `just deploy`.
telegram_proxy_enabled: "{{ (vault_telegram_tunnel_host | default('')) | length > 0 }}"
telegram_proxy_url: "{{ 'socks5://telegram-proxy:1080' if telegram_proxy_enabled else '' }}"

# --- Аналитика и подтверждение прав на сайт (необязательно, не секреты) ---
yandex_metrika_id: "40686419"
yandex_verification: "5c52a869de8140b1"
# TODO: код подтверждения прав на сайт из Google Search Console
google_site_verification: ""

# --- Общий Caddy для двух сайтов на одном VPS (см. docs/decor-site-audit.md §5) ---
# floway_prod — единственная группа, которая рендерит и рестартует Caddy
# (Caddyfile.j2, tasks/main.yml). floway_decor_prod этот шаг у себя пропускает.
owns_shared_caddy: true
# Второй сайт (flo-way.ru, decor-стек) — свой домен, свои backend/frontend
# контейнеры на общей сети caddy_net (см. docker-compose.decor.prod.yml).
# backend_addr/frontend_addr — DNS-имена сервисов в сети caddy_net, не URL.
caddy_extra_sites:
  - domain: "flo-way.ru"
    backend_addr: "backend-decor:8080"
    frontend_addr: "frontend-decor:3000"
