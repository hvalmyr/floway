---
- name: Install unattended-upgrades packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable periodic apt updates and unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

# Не перезагружаем прод-машину автоматически без ведома оператора — только
# ставим security-патчи. Ubuntu уже включает Ubuntu:${distro_codename}-security
# в /etc/apt/apt.conf.d/50unattended-upgrades по умолчанию.
- name: Disable automatic reboot after unattended upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^[/\s]*Unattended-Upgrade::Automatic-Reboot\b'
    line: 'Unattended-Upgrade::Automatic-Reboot "false";'
    insertafter: EOF
