---
# Shared between docker-compose.prod.yml and docker-compose.decor.prod.yml
# (two independent Compose projects) — created once, idempotently, whichever
# group deploys first. Neither compose file owns it (both declare it
# `external: true`), so this never gets removed by either project's own
# lifecycle (docker_compose_v2 down/prune).
- name: Ensure the shared Caddy docker network exists
  community.docker.docker_network:
    name: caddy_net
    state: present

- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ deploy_path }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Template .env file (contains secrets — mode 0600)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_path }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: Copy production docker-compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ compose_file | default('docker-compose.prod.yml') }}"
    dest: "{{ deploy_path }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

# Garage не собирается в CI и не публикуется в GHCR (в отличие от
# backend/frontend) — это лёгкая обвязка вокруг стороннего бинаря, поэтому
# докер-compose собирает её прямо на VPS (build: ./garage). Значит сама
# директория со сборочным контекстом должна физически там оказаться.
- name: Copy Garage build context (Dockerfile, entrypoint, config)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../garage/"
    dest: "{{ deploy_path }}/garage/"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Copy Telegram proxy build context (SOCKS5 sidecar, see README.md)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../telegram-proxy/"
    dest: "{{ deploy_path }}/telegram-proxy/"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Write Telegram tunnel private key
  ansible.builtin.copy:
    content: "{{ vault_telegram_tunnel_private_key }}"
    dest: "{{ deploy_path }}/telegram-tunnel-key"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  when: telegram_proxy_enabled

# Only floway_prod (owns_shared_caddy: true) renders/owns the shared
# Caddyfile — floway_decor_prod's deploy_path has no Caddy container to
# write it for or restart (see docs/decor-site-audit.md §5). Caddyfile.j2
# itself already covers both domains via caddy_extra_sites (defined on
# floway_prod's own vars.yml), so nothing here needs the decor group's vars.
- name: Template Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ deploy_path }}/Caddyfile"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
  notify: restart caddy
  when: owns_shared_caddy | default(true)

- name: Log in to GHCR
  ansible.builtin.shell: |
    set -euo pipefail
    echo "{{ vault_ghcr_token }}" | docker login ghcr.io -u "{{ vault_ghcr_username }}" --password-stdin
  args:
    executable: /bin/bash
  when: ghcr_login_required
  no_log: true
  changed_when: true

- name: Pull latest images and (re)start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_path }}"
    pull: always
    build: always
    state: present
    remove_orphans: true

- name: Prune dangling Docker images to save disk space
  community.docker.docker_prune:
    images: true
