---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/ubuntu"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: "https://download.docker.com/linux/ubuntu/gpg"
    state: present

- name: Install Docker Engine, CLI, containerd and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

# community.docker's Python-SDK-backed modules (e.g. docker_prune, used in
# deploy_app) talk to the Docker Engine API directly rather than shelling
# out — unlike docker_compose_v2, which just calls the `docker compose` CLI.
- name: Install Python Docker SDK (needed by community.docker's API-based modules)
  ansible.builtin.apt:
    name:
      - python3-docker
      - python3-requests
    state: present

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
