services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floway}
      POSTGRES_DB: ${POSTGRES_DB:-floway}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floway} -d ${POSTGRES_DB:-floway}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  migrate:
    build:
      context: ./backend
    entrypoint: ["./goose"]
    command:
      - "-dir"
      - "migrations"
      - "postgres"
      - "postgres://${POSTGRES_USER:-floway}:${POSTGRES_PASSWORD:-floway}@postgres:5432/${POSTGRES_DB:-floway}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  garage:
    build:
      context: ./garage
    restart: unless-stopped
    environment:
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-GKdev00000000000000000}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:-devsecretkeydevsecretkeydevsecretkeydevsecretkey0}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-floway-uploads}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-floway}:${POSTGRES_PASSWORD:-floway}@postgres:5432/${POSTGRES_DB:-floway}?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_REGION: garage
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-GKdev00000000000000000}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:-devsecretkeydevsecretkeydevsecretkeydevsecretkey0}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-floway-uploads}
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${HTTP_PORT:-8080}
      # SSR внутри контейнера должно идти на backend по docker-сети, не по
      # localhost (см. комментарий в frontend/app/composables/useApiClient.ts).
      NUXT_API_BASE_INTERNAL: http://backend:${HTTP_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  garage_meta:
  garage_data:
