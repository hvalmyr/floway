# Продакшен-конфигурация, разворачивается на VPS через ansible/playbooks/deploy.yml.
#
# Отличия от dev-версии (docker-compose.yml):
# - backend/frontend берутся как готовые образы из GHCR (ghcr.io/<owner>/floway-*),
#   а не собираются на месте — сборка происходит в CI (GitHub Actions);
# - никакого Mailhog — SMTP_* указывают на реальный почтовый сервис;
# - postgres/backend/frontend не публикуют порты наружу — единственная точка
#   входа снаружи это Caddy (80/443), всё остальное только по docker-сети;
# - добавлен Caddy: автоматический HTTPS по FLOWAY_DOMAIN, реверс-прокси
#   /api/* и /healthz -> backend, всё остальное -> frontend.
#
# Требуемые переменные окружения — см. ansible/roles/deploy_app/templates/env.j2
# (шаблонизируется Ansible из group_vars + vault.yml, на VPS кладётся в .env
# рядом с этим файлом).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    entrypoint: ["./goose"]
    command:
      - "-dir"
      - "migrations"
      - "postgres"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  garage:
    build:
      context: ./garage
    restart: unless-stopped
    environment:
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_BUCKET: ${GARAGE_BUCKET}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: https://${FLOWAY_DOMAIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_REGION: garage
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_BUCKET: ${GARAGE_BUCKET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: https://${FLOWAY_DOMAIN}
      # SSR внутри контейнера должно идти на backend по docker-сети напрямую,
      # а не через публичный домен/Caddy (см. комментарий в
      # frontend/app/composables/useApiClient.ts).
      NUXT_API_BASE_INTERNAL: http://backend:8080
      # @nuxt/image (IPX) фетчит оригиналы сам, всегда из процесса Nitro —
      # тот же internal-адрес, что и выше, но обязан быть public (см.
      # комментарий у mediaOptimizeBase в nuxt.config.ts). Без явного
      # значения тут контейнер стартует со значением, запечённым при сборке
      # образа в CI (nuxt build идёт без этих переменных — см. Dockerfile),
      # а это localhost:8080, который внутри контейнера указывает сам на
      # себя — из-за этого на проде не грузилась ни одна картинка.
      NUXT_PUBLIC_MEDIA_OPTIMIZE_BASE: http://backend:8080
      # ipx (used by @nuxt/image) is supposed to derive its own Cache-Control
      # from a HEAD probe against mediaOptimizeBase — but that HEAD still
      # wasn't reaching a usable answer even after the backend started
      # answering it correctly on its own (curl confirmed 200 + a real
      # Cache-Control; images kept re-downloading on every reload anyway —
      # root cause of that gap unresolved). ipxHttpStorage.getMeta()
      # swallows any failed/erroring probe into `{}`, which then falls
      # through to createIPX's own top-level maxAge default (IPX_MAX_AGE,
      # not IPX_HTTP_MAX_AGE — that one only kicks in when the probe
      # *succeeds* but the upstream response itself lacks Cache-Control) —
      # confirmed locally: setting IPX_MAX_AGE is what actually produced a
      # real Cache-Control header end to end. Uploaded images are immutable
      # (UUID keys, never edited in place — see upload_handler.go), so a
      # static 1-year value is the objectively correct policy regardless of
      # whether the dynamic probe ever gets sorted out. Both env vars read
      # directly by ipx itself (no NUXT_/NITRO_ prefix — see its own
      # getEnv), set together as a safety net either way.
      IPX_MAX_AGE: "31536000"
      IPX_HTTP_MAX_AGE: "31536000"
      # Все три необязательны (см. ansible/inventory/group_vars/floway_prod/vars.yml) —
      # пустое значение просто не рендерит счётчик/мета-тег.
      NUXT_PUBLIC_YANDEX_METRIKA_ID: ${NUXT_PUBLIC_YANDEX_METRIKA_ID:-}
      NUXT_PUBLIC_YANDEX_VERIFICATION: ${NUXT_PUBLIC_YANDEX_VERIFICATION:-}
      NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:
